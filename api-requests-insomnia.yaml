      rebuildPath: true
  - url: "{{ _.base_url }}/classifications/history"
    name: "3. Clasificaciones: Historial global de la comunidad"
    meta:
      id: req_610b260c9d9a4ef8aeea561cfba714c0
      created: 1779305781702
      modified: 1779314150337
      isPrivate: false
      description: Feed global paginado (máx 50). Pasa nextToken como query param para
        ir a la siguiente página.
      sortKey: 200
    method: GET
    parameters:
      - name: limit
        value: "50"
        disabled: false
      - name: nextToken
        value: ""
        disabled: true
    headers:
      - name: Authorization
        value: Bearer {{ _.id_token }}
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.private_base_url }}/upload/presigned"
    name: "4.1. Upload: Obtener URLs prefirmadas para subida directa a S3"
    meta:
      id: req_0163378c334c4da6b19b6301408a4ede
      created: 1779305781703
      modified: 1779316247571
      isPrivate: false
      description: Genera N presigned PUT URLs válidos por 1 hora. El cliente usa cada
        uploadUrl para hacer PUT directamente a S3 con la imagen en binario.
      sortKey: 300
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "images": [
            { "filename": "galaxy1.jpg", "contentType": "image/jpeg" },
            { "filename": "galaxy2.png", "contentType": "image/png" }
          ]
        }
    headers:
      - name: Authorization
        value: Bearer {{ _.id_token }}
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.private_base_url }}/classifications"
    name: "5. Ingestión: Encolar imágenes subidas para clasificación"
    meta:
      id: req_b90016ef9837474583814cde2c827012
      created: 1779305781704
      modified: 1779316372961
      isPrivate: false
      description: "Valida cuota diaria (público: 10 imgs/día), crea job en DynamoDB y
        encola mensajes en SQS. Devuelve 202 con jobId. Devuelve 429 si se
        supera la cuota."
      sortKey: 400
    method: POST
    body:
      mimeType: application/json
      text: >-
        {
          "images": [
            { "key": "galaxies/216b85c0-f081-70d0-0343-2f036d92beaf/fafcb41d-35c0-4217-88d0-dea0ce4696f9/galaxy1.jpg" },
            { "key": "galaxies/216b85c0-f081-70d0-0343-2f036d92beaf/b7df8167-6840-4156-a1f8-845634cf39fc/galaxy2.png" }
          ]
        }
    headers:
      - name: Authorization
        value: Bearer {{ _.id_token }}
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
