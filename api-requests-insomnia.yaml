  - url: "wss://fumt26qrmfahvnnnla44rcctd4.appsync-realtime-api.us-east-2.amazonaws.com/graphql?header={{ _.appsync_ws_header }}&payload={{ _.appsync_ws_payload }}"
    name: "6. AppSync: Suscripción en tiempo real (WebSocket)"
    meta:
      id: ws-req_bb81c8309e6344fdae7ef41d7382a0ab
      created: 1779676731731
      modified: 1779676902643
      description: |-
        Protocolo: graphql-ws sobre AppSync Realtime API.
        ⚠️  appsync_ws_header caduca con el id_token (1 hora). Para regenerarlo:
          node -e "const t='<id_token>',h='fumt26qrmfahvnnnla44rcctd4.appsync-api.us-east-2.amazonaws.com';console.log(Buffer.from(JSON.stringify({Authorization:t,host:h})).toString('base64'))"

        SECUENCIA DE MENSAJES:

        1. Conectar y enviar:
           {"type":"connection_init"}
           → esperar: {"type":"connection_ack"}

        2. Suscribirse (reemplaza {{ _.user_sub }} si lo copias a mano):
           {"id":"sub1","type":"start","payload":{"data":"{\"query\":\"subscription OnClassification($clientId: ID!) { onClassification(clientId: $clientId) { jobId clientId imageKey status classification { predictedClass confidence probabilities } errorMessage } }\",\"variables\":{\"clientId\":\"{{ _.user_sub }}\"}}","extensions":{"authorization":{"Authorization":"{{ _.id_token }}","host":"{{ _.appsync_graphql_host }}"}}}}
           → esperar: {"id":"sub1","type":"start_ack"}
           → datos llegan como: {"id":"sub1","type":"data","payload":{"data":{"onClassification":{...}}}}

        3. Cancelar suscripción:
           {"id":"sub1","type":"stop"}
      sortKey: 500
    settings:
      encodeUrl: false
      cookies:
        store: true
        send: true
      followRedirects: global
    headers:
      - name: Sec-WebSocket-Protocol
        value: graphql-ws
      - name: User-Agent
        value: insomnia/12.5.0
        description: ""
        disabled: false
