  - url: "{{ _.base_url }}/classifications/history"
    name: "3. Clasificaciones: Historial global de la comunidad"
    meta:
      id: req_c2da4eee83fa474ba3f385742750ae52
      created: 1779305781702
      modified: 1779314150337
      isPrivate: false
      description: Feed global paginado (máx 50). Pasa nextToken como query param para
        ir a la siguiente página.
      sortKey: 200
    method: GET
    parameters:
      - name: limit
        value: "50"
        disabled: false
      - name: nextToken
        value: ""
        disabled: true
    headers:
      - name: Authorization
        value: Bearer {{ _.id_token }}
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.private_base_url }}/upload/presigned"
    name: "4.1. Upload: Obtener URLs prefirmadas para subida directa a S3"
    meta:
      id: req_4d0aad52077649e493b56971e83b17bf
      created: 1779305781703
      modified: 1779676115167
      isPrivate: false
      description: Genera N presigned PUT URLs válidos por 1 hora. El cliente usa cada
        uploadUrl para hacer PUT directamente a S3 con la imagen en binario.
      sortKey: 300
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "images": [
            { "filename": "galaxy1.jpg", "contentType": "image/jpg" }
          ]
        }
    headers:
      - name: Authorization
        value: Bearer {{ _.id_token }}
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
  - url: "{{ _.private_base_url }}/classifications"
    name: "5. Ingestión: Encolar imágenes subidas para clasificación"
    meta:
      id: req_afbcd2c81c37448caa369dc43ab528f0
      created: 1779305781704
      modified: 1779851825853
      isPrivate: false
      description: "Valida cuota diaria (público: 10 imgs/día), crea job en DynamoDB y
        encola mensajes en SQS. Devuelve 202 con jobId. Devuelve 429 si se
        supera la cuota."
      sortKey: 400
    method: POST
    body:
      mimeType: application/json
      text: >-
        {
          "images": [
            { "key": "galaxies/316b65f0-3001-70a9-39a1-36b35a4cf452/3f78623d-01dc-4a3b-bbd3-9b3035c06c5f/galaxy1.jpg" }
          ]
        }
    headers:
      - name: Authorization
        value: Bearer {{ _.id_token }}
      - name: Content-Type
        value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
